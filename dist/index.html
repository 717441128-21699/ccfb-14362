<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>八百里加急 · 驿路调度沙盘</title>
    <script type="module" crossorigin src="/assets/index-DfifrKzy.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BMq6S39i.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">八百里加急<small>驿路接力调度沙盘</small></div>
      <nav class="tabs">
        <button class="tab-btn" data-tab="map">驿路地图</button>
        <button class="tab-btn" data-tab="station">驿站兵马</button>
        <button class="tab-btn" data-tab="stats">准时统计</button>
        <button class="tab-btn" data-tab="rules">规则调参</button>
      </nav>
      <div class="top-controls">
        <span id="clock">第 1 日 00:00</span>
        <button id="btn-play" class="btn">运行</button>
        <button id="btn-step" class="btn">单步</button>
        <select id="speed-select" title="仿真速度">
          <option value="800">慢速</option>
          <option value="400" selected>常速</option>
          <option value="120">快速</option>
          <option value="30">极速</option>
        </select>
        <button id="btn-replan" class="btn">全量重规划</button>
        <select id="spawn-urgency" title="新公文紧急等级">
          <option value="1">一等加急</option>
          <option value="2">二等紧急</option>
          <option value="3">常规公文</option>
        </select>
        <button id="btn-spawn" class="btn">派单</button>
        <input id="seed-input" type="number" title="地图随机种子" />
        <button id="btn-regen" class="btn">换地图</button>
      </div>
    </header>

    <div class="kpi-strip">
      <div class="kpi"><b id="kpi-documents">0</b><span>累计公文</span></div>
      <div class="kpi"><b id="kpi-intransit">0</b><span>在途</span></div>
      <div class="kpi"><b id="kpi-queued">0</b><span>待派</span></div>
      <div class="kpi"><b id="kpi-overdue">0</b><span>超时</span></div>
      <div class="kpi"><b id="kpi-replan-ms">0.00 ms</b><span>上次重规划耗时</span></div>
    </div>

    <main>
      <section data-panel="map">
        <svg id="map-canvas" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet"></svg>
      </section>
      <section data-panel="station" class="hidden">
        <div id="station-panel"></div>
      </section>
      <section data-panel="stats" class="hidden">
        <div id="stats-panel"></div>
      </section>
      <section data-panel="rules" class="hidden">
        <div id="rules-panel"></div>
      </section>
    </main>

    <div id="flash"></div>
  </body>
</html>
